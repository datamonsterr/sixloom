# sixloom skill catalog: the single source of truth for packs, skills,
# upstream provenance and which project choices install which skill.
#
# Pack IDs double as other-skill (https://github.com/datamonsterr/other-skill)
# category IDs, so `sixloom init --bank` can write a routable bank.
#
# `when` decides native installation at `sixloom init`:
#   "always"                 core of the framework
#   "frontend:<id>"          sixloom.toml frontend.framework
#   "ui:<id>"                sixloom.toml frontend.ui_kit
#   "docs:<id>"              sixloom.toml docs.engine
#   "design:<id>"            sixloom.toml design.tool
#   a list means any-of. Skills whose `when` does not match go to the bank
#   (with --bank) or are skipped.
#
# `upstream` skills are vendored by scripts/vendor_skills.py at the pinned git `rev`
# (`repo`) or pinned npm package version (`npm`).
# `patch` lists the edits sixloom makes on top of upstream (applied by the script).

version = 1

[[pack]]
id = "core"
title = "sixloom core"
description = "The sixloom looms: spec, design, preview, data model, system design, API docs, test suites, autonomous build, patch and validate"

[[pack]]
id = "engineering"
title = "Engineering"
description = "Test-driven development, design interviews (grilling) and bug diagnosis"

[[pack]]
id = "design"
title = "Design"
description = "Visual direction, design systems and screen generation with Claude Design or Google Stitch"

[[pack]]
id = "frontend"
title = "Front-end frameworks"
description = "Framework-specific guidance for React, Next.js, Vue, Nuxt, Vite, Svelte and shadcn/ui"

[[pack]]
id = "docs"
title = "Documentation engines"
description = "Docs sites with MDX, Mermaid and generated OpenAPI references: Fumadocs, Docusaurus, Starlight"

[[pack]]
id = "testing"
title = "Testing"
description = "Browser automation and end-to-end testing with Playwright, and unit testing with Vitest"

