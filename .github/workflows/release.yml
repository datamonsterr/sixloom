name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'linux')
        with: { tool: cross }
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]]; then cross build --release --target ${{ matrix.target }}
          else cargo build --release --target ${{ matrix.target }}; fi
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then 7z a ../../../sixloom-${{ matrix.target }}.zip sixloom.exe
          else tar czf ../../../sixloom-${{ matrix.target }}.tar.gz sixloom; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: sixloom-${{ matrix.target }}.*
